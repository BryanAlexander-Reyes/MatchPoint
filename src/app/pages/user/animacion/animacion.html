<div class="animacion-page">
  <section class="animacion-shell" aria-label="Acceso a MATCH POINT">
    <!-- ==========================================================
         ESCENARIO IZQUIERDO
         Aquí vive el espacio reservado para tu animación.
         ========================================================== -->
    <aside class="animation-stage">
      <div class="stage-copy">
        <span class="stage-eyebrow">Reserva de canchas</span>
        <h1>Tu próxima cancha,<span> a un clic.</span></h1>
        <p>
          Inicia sesión, crea tu cuenta o recupera tu acceso sin salir de esta
          pantalla.
        </p>
      </div>

      <!-- ==========================================================
           ESPACIO RESERVADO PARA TU ANIMACIÓN
           ----------------------------------------------------------
           Inserta aquí tu SVG, Lottie, canvas o animación CSS.
           El contenedor ya está centrado, tiene tamaño propio y se
           adapta a móvil. No necesita estilos adicionales.
           ========================================================== -->
      <div class="animation-slot" id="animation-slot">
        <!-- TU ANIMACIÓN VA AQUÍ -->
      </div>
    </aside>

    <!-- ==========================================================
         PANEL DERECHO: LOS TRES COMPONENTES EN UNO SOLO
         Se muestra uno a la vez y los enlaces internos de cada
         componente cambian la vista sin recargar la página.
         ========================================================== -->
    <div class="auth-panel">
      <app-login
        *ngIf="vista === 'login'"
        [embebido]="true"
        (irARegistro)="cambiarVista('registro')"
        (abrirRecuperarComponent)="cambiarVista('restablecer')"
      ></app-login>

      <app-register
        *ngIf="vista === 'registro'"
        [embebido]="true"
        (irAlogin)="cambiarVista('login')"
      ></app-register>

      <app-restablecer
        *ngIf="vista === 'restablecer'"
        [embebido]="true"
        (irAlLogin)="cambiarVista('login')"
      ></app-restablecer>
    </div>
  </section>
</div>
