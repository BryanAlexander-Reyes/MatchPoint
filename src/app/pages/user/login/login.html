
<!-- Font Awesome -->
<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
/>

<!-- =========================================
     FORMULARIO LOGIN
     ========================================= -->
<div class="login">

  <!-- TÍTULO -->
  <div class="login-section">
    <h1>Iniciar Sesión</h1>
  </div>


  <!-- =====================================
       CORREO
       ===================================== -->
  <div class="form-group">

    <label for="usuario">
      Correo Electrónico
    </label>

    <input
      type="email"
      id="usuario"
      placeholder="Ingrese su correo"
      [(ngModel)]="email"
    />

  </div>


  <!-- =====================================
       CONTRASEÑA
       ===================================== -->
  <div class="form-group">

    <label for="contraseña">
      Contraseña
    </label>

    <input
      type="password"
      id="contraseña"
      placeholder="Ingrese su contraseña"
      [(ngModel)]="password"
    />

  </div>


  <!-- =====================================
       RECUPERAR CONTRASEÑA
       ===================================== -->
  <div class="recover-password">

    <a (click)="abrirRecuperar()">
      ¿Olvidaste tu contraseña? 
    </a>
    

  </div>


  <!-- =====================================
       BOTÓN INGRESAR
       ===================================== -->
  <button
    type="button"
    (click)="login()"
    class="login-button"
  >
    Ingresar
  </button>


  <!-- =====================================
       IR A REGISTRO
       ===================================== -->
  <div class="registro">

    <span>
      ¿No tienes una cuenta?
    </span>

    <a
      (click)="goToRegister()"
    >
      Regístrate
    </a>

  </div>


  <!-- =====================================
       LOGIN CON GOOGLE
       ===================================== -->
  <div class="boton">

    <button
      type="button"
      class="boton-rapido"
    >
      <i class="fa-brands fa-google"></i>
    </button>
    <button
      type="button"
      class="boton-rapido"
    >
      <i class="fa-brands fa-facebook"></i>
    </button>
  </div>
  

</div>
